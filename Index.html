
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Weather Dashboard</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #101d40, #253f70);
    color: white;
    min-height: 100vh;
    padding: 30px 15px;
}

.container {
    max-width: 900px;
    margin: auto;
}

header {
    text-align: center;
    margin-bottom: 30px;
}

header h1 {
    font-size: 32px;
    margin-bottom: 10px;
}

header p {
    color: #c5d4ed;
}

.search-box {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
}

input {
    flex: 1;
    min-width: 0;
    padding: 15px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
}

button {
    padding: 14px 22px;
    background: #39a9ff;
    border: none;
    color: white;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    transition: .3s;
}

button:hover {
    background: #147bd1;
    transform: translateY(-2px);
}

button:disabled {
    opacity: .6;
    cursor: wait;
}

.message {
    text-align: center;
    margin: 15px 0;
    color: #ffd58a;
    min-height: 20px;
}

.weather-card {
    display: none;
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.15);
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    margin-bottom: 25px;
}

.city {
    font-size: 27px;
    margin-bottom: 10px;
}

.weather-icon {
    font-size: 65px;
    margin: 15px;
}

.temperature {
    font-size: 55px;
    font-weight: bold;
}

.condition {
    color: #d5e5ff;
    margin: 10px 0 25px;
}

.details {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.detail {
    background: rgba(255,255,255,.1);
    padding: 15px 8px;
    border-radius: 12px;
}

.detail p {
    color: #c5d4ed;
    font-size: 13px;
    margin-bottom: 8px;
}

.detail h3 {
    font-size: 18px;
}

.forecast-title {
    margin: 25px 0 15px;
}

.forecast {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
}

.day {
    background: rgba(255,255,255,.12);
    padding: 18px 8px;
    border-radius: 13px;
    text-align: center;
    transition: .3s;
}

.day:hover {
    transform: translateY(-6px);
    background: rgba(255,255,255,.22);
}

.day-icon {
    font-size: 30px;
    margin: 12px 0;
}

.day p {
    font-size: 13px;
    margin: 6px 0;
}

footer {
    text-align: center;
    margin-top: 35px;
    color: #c5d4ed;
    font-size: 13px;
}

@media(max-width: 600px) {
    header h1 {
        font-size: 25px;
    }

    .search-box {
        flex-direction: column;
    }

    .search-box button {
        width: 100%;
    }

    .weather-card {
        padding: 20px 12px;
    }

    .forecast {
        grid-template-columns: repeat(2, 1fr);
    }

    .details {
        gap: 7px;
    }

    .detail h3 {
        font-size: 15px;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>🌤️ Weather Dashboard</h1>
    <p>Check real-time weather around the world</p>
</header>

<div class="search-box">
    <input
        type="text"
        id="cityInput"
        placeholder="Enter city name (e.g. Chennai)"
        aria-label="Enter city name"
    >
    <button id="searchBtn" onclick="getWeather()">
        Search
    </button>
</div>

<div class="message" id="message" role="status"></div>

<section class="weather-card" id="weatherCard">

    <h2 class="city" id="cityName"></h2>

    <div class="weather-icon" id="weatherIcon"></div>

    <div class="temperature" id="temperature"></div>

    <p class="condition" id="condition"></p>

    <div class="details">

        <div class="detail">
            <p>Feels Like</p>
            <h3 id="feelsLike">--</h3>
        </div>

        <div class="detail">
            <p>Humidity</p>
            <h3 id="humidity">--</h3>
        </div>

        <div class="detail">
            <p>Wind Speed</p>
            <h3 id="wind">--</h3>
        </div>

    </div>

</section>

<h2 class="forecast-title" id="forecastTitle"
    style="display:none">5-Day Forecast</h2>

<div class="forecast" id="forecast"></div>

<footer>
    Weather data powered by Open-Meteo API
</footer>

</div>

<script>

const input = document.getElementById("cityInput");
const button = document.getElementById("searchBtn");
const message = document.getElementById("message");

// Weather description and icon
function getWeatherInfo(code) {

    const weather = {
        0: ["Clear Sky", "☀️"],
        1: ["Mainly Clear", "🌤️"],
        2: ["Partly Cloudy", "⛅"],
        3: ["Overcast", "☁️"],
        45: ["Fog", "🌫️"],
        48: ["Rime Fog", "🌫️"],
        51: ["Light Drizzle", "🌦️"],
        53: ["Drizzle", "🌦️"],
        55: ["Heavy Drizzle", "🌧️"],
        61: ["Light Rain", "🌧️"],
        63: ["Rain", "🌧️"],
        65: ["Heavy Rain", "🌧️"],
        71: ["Light Snow", "🌨️"],
        73: ["Snow", "❄️"],
        75: ["Heavy Snow", "❄️"],
        80: ["Rain Showers", "🌦️"],
        81: ["Heavy Showers", "🌧️"],
        82: ["Violent Showers", "⛈️"],
        95: ["Thunderstorm", "⛈️"],
        96: ["Thunderstorm with Hail", "⛈️"],
        99: ["Heavy Thunderstorm", "⛈️"]
    };

    return weather[code] || ["Unknown Weather", "🌡️"];
}

// Main weather function
async function getWeather() {

    const city = input.value.trim();

    if (!city) {
        message.textContent = "Please enter a city name!";
        return;
    }

    button.disabled = true;
    button.textContent = "Loading...";
    message.textContent = "Fetching weather data...";

    document.getElementById("weatherCard").style.display = "none";
    document.getElementById("forecast").innerHTML = "";
    document.getElementById("forecastTitle").style.display = "none";

    try {

        // Step 1: Get city coordinates
        const geoURL =
            "https://geocoding-api.open-meteo.com/v1/search?name="
            + encodeURIComponent(city)
            + "&count=1&language=en&format=json";

        const geoResponse = await fetch(geoURL);

        if (!geoResponse.ok) {
            throw new Error("Unable to search for city.");
        }

        const geoData = await geoResponse.json();

        if (!geoData.results || geoData.results.length === 0) {
            throw new Error("City not found! Try another city.");
        }

        const place = geoData.results[0];

        const latitude = place.latitude;
        const longitude = place.longitude;

        // Step 2: Fetch current weather and 5-day forecast
        const weatherURL =
            "https://api.open-meteo.com/v1/forecast?"
            + "latitude=" + latitude
            + "&longitude=" + longitude
            + "&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m"
            + "&daily=weather_code,temperature_2m_max,temperature_2m_min"
            + "&forecast_days=5"
            + "&timezone=auto";

        const weatherResponse = await fetch(weatherURL);

        if (!weatherResponse.ok) {
            throw new Error("Weather service is unavailable.");
        }

        const data = await weatherResponse.json();

        if (!data.current || !data.daily) {
            throw new Error("Weather data is unavailable.");
        }

        // Step 3: Display current weather
        const current = data.current;
        const info = getWeatherInfo(current.weather_code);

        document.getElementById("cityName").textContent =
            place.name + ", " + (place.country || "");

        document.getElementById("weatherIcon").textContent =
            info[1];

        document.getElementById("temperature").textContent =
            Math.round(current.temperature_2m) + "°C";

        document.getElementById("condition").textContent =
            info[0];

        document.getElementById("feelsLike").textContent =
            Math.round(current.apparent_temperature) + "°C";

        document.getElementById("humidity").textContent =
            current.relative_humidity_2m + "%";

        document.getElementById("wind").textContent =
            current.wind_speed_10m + " km/h";

        document.getElementById("weatherCard").style.display =
            "block";

        // Step 4: Dynamically generate forecast cards
        const forecast = document.getElementById("forecast");

        document.getElementById("forecastTitle").style.display =
            "block";

        for (let i = 0; i < data.daily.time.length; i++) {

            const dayInfo =
                getWeatherInfo(data.daily.weather_code[i]);

            const date = new Date(
                data.daily.time[i] + "T00:00:00"
            );

            const dayName = date.toLocaleDateString(
                "en-US", { weekday: "short" }
            );

            const card = document.createElement("div");
            card.className = "day";

            card.innerHTML = `
                <h3>${dayName}</h3>
                <div class="day-icon">${dayInfo[1]}</div>
                <p>${dayInfo[0]}</p>
                <p><strong>
                    ${Math.round(data.daily.temperature_2m_max[i])}°
                    /
                    ${Math.round(data.daily.temperature_2m_min[i])}°
                </strong></p>
            `;

            forecast.appendChild(card);
        }

        message.textContent = "";

    } catch (error) {

        message.textContent = error.message;
        document.getElementById("weatherCard").style.display =
            "none";

    } finally {

        button.disabled = false;
        button.textContent = "Search";

    }
}

// Search when Enter key is pressed
input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        getWeather();
    }
});

</script>

</body>
</html>
